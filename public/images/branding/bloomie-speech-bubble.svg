<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#FFFBF5"/>
  <text x="200" y="30" text-anchor="middle" font-size="12" font-weight="600" fill="#8B8094" font-family="'Poppins', sans-serif" letter-spacing="2">BLOOMIE — SPEECH BUBBLE</text>

  <!-- Speech bubble -->
  <g transform="translate(210, 130)">
    <rect x="-80" y="-40" width="160" height="70" rx="35" fill="#FFF2C4" stroke="#3D2B4F" stroke-width="2"/>
    <path d="M -20,28 L -28,48 L -6,32 Z" fill="#FFF2C4" stroke="#3D2B4F" stroke-width="2"/>
    <path d="M -20,28 L -28,48 L -6,32" fill="#FFF2C4"/>
    <!-- Covering the inner line -->
    <line x1="-22" y1="30" x2="-8" y2="30" stroke="#FFF2C4" stroke-width="3"/>

    <text x="0" y="-5" text-anchor="middle" font-size="14" font-weight="600" fill="#3D2B4F" font-family="'Fredoka', sans-serif">psst...</text>
    <text x="0" y="15" text-anchor="middle" font-size="11" fill="#3D2B4F" font-family="'Poppins', sans-serif">new drop today 🌸</text>
  </g>

  <g transform="translate(160, 280)">
    <!-- Stem -->
    <rect x="-5" y="55" width="10" height="45" rx="5" fill="#D4E9D0"/>
    <ellipse cx="15" cy="85" rx="13" ry="6" fill="#D4E9D0" transform="rotate(30 15 85)"/>

    <!-- Petals -->
    <ellipse cx="0" cy="-42" rx="23" ry="32" fill="#FFD4DE"/>
    <ellipse cx="-40" cy="-15" rx="23" ry="32" fill="#FFD4DE" transform="rotate(-60 -40 -15)"/>
    <ellipse cx="40" cy="-15" rx="23" ry="32" fill="#FFD4DE" transform="rotate(60 40 -15)"/>
    <ellipse cx="-30" cy="30" rx="23" ry="32" fill="#FFD4DE" transform="rotate(-130 -30 30)"/>
    <ellipse cx="30" cy="30" rx="23" ry="32" fill="#FFD4DE" transform="rotate(130 30 30)"/>

    <!-- Face -->
    <circle cx="0" cy="0" r="34" fill="#FFF2C4"/>
    <circle cx="-17" cy="7" r="5" fill="#FF4D6D" opacity="0.45"/>
    <circle cx="17" cy="7" r="5" fill="#FF4D6D" opacity="0.45"/>
    <!-- Looking up, cheeky -->
    <circle cx="-8" cy="-8" r="3" fill="#3D2B4F"/>
    <circle cx="8" cy="-8" r="3" fill="#3D2B4F"/>
    <path d="M -6,6 Q 0,11 6,6" stroke="#3D2B4F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <text x="200" y="380" text-anchor="middle" font-size="11" fill="#8B8094" font-family="'Poppins', sans-serif">For tips, announcements, FAQ helper, promo callouts</text>
</svg>
