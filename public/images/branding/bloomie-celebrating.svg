<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#FFFBF5"/>
  <text x="200" y="30" text-anchor="middle" font-size="12" font-weight="600" fill="#8B8094" font-family="'Poppins', sans-serif" letter-spacing="2">BLOOMIE — CELEBRATING</text>

  <!-- Confetti -->
  <rect x="60" y="70" width="10" height="4" fill="#FF4D6D" transform="rotate(25 65 72)"/>
  <rect x="90" y="110" width="8" height="4" fill="#E4D6FF" transform="rotate(-40 94 112)"/>
  <rect x="320" y="80" width="10" height="4" fill="#FFF2C4" transform="rotate(60 325 82)"/>
  <rect x="340" y="130" width="8" height="4" fill="#D4E9D0" transform="rotate(15 344 132)"/>
  <rect x="55" y="160" width="8" height="4" fill="#FF4D6D" transform="rotate(-20 59 162)"/>
  <rect x="330" y="200" width="10" height="4" fill="#E4D6FF" transform="rotate(45 335 202)"/>
  <circle cx="100" cy="90" r="3" fill="#FFD4DE"/>
  <circle cx="310" cy="160" r="3" fill="#FF4D6D"/>
  <circle cx="75" cy="130" r="3" fill="#E4D6FF"/>
  <circle cx="320" cy="100" r="3" fill="#D4E9D0"/>

  <!-- Sparkles -->
  <g fill="#FFF2C4" stroke="#FF4D6D" stroke-width="1">
    <path d="M 120,55 L 123,63 L 131,66 L 123,69 L 120,77 L 117,69 L 109,66 L 117,63 Z"/>
    <path d="M 285,55 L 288,63 L 296,66 L 288,69 L 285,77 L 282,69 L 274,66 L 282,63 Z"/>
  </g>

  <g transform="translate(200, 230)">
    <!-- Stem -->
    <rect x="-5" y="60" width="10" height="50" rx="5" fill="#D4E9D0"/>
    <ellipse cx="18" cy="90" rx="15" ry="7" fill="#D4E9D0" transform="rotate(30 18 90)"/>

    <!-- Petals (brighter mix) -->
    <ellipse cx="0" cy="-48" rx="26" ry="36" fill="#FFD4DE"/>
    <ellipse cx="-46" cy="-18" rx="26" ry="36" fill="#FFD4DE" transform="rotate(-60 -46 -18)"/>
    <ellipse cx="46" cy="-18" rx="26" ry="36" fill="#FFD4DE" transform="rotate(60 46 -18)"/>
    <ellipse cx="-34" cy="36" rx="26" ry="36" fill="#FFD4DE" transform="rotate(-130 -34 36)"/>
    <ellipse cx="34" cy="36" rx="26" ry="36" fill="#FFD4DE" transform="rotate(130 34 36)"/>

    <!-- Face -->
    <circle cx="0" cy="0" r="38" fill="#FFF2C4"/>
    <circle cx="-19" cy="8" r="6" fill="#FF4D6D" opacity="0.5"/>
    <circle cx="19" cy="8" r="6" fill="#FF4D6D" opacity="0.5"/>
    <!-- Happy star-shaped eyes -->
    <path d="M -10,-8 L -8,-3 L -3,-2 L -7,1 L -5,6 L -10,3 L -15,6 L -13,1 L -17,-2 L -12,-3 Z" fill="#3D2B4F"/>
    <path d="M 10,-8 L 12,-3 L 17,-2 L 13,1 L 15,6 L 10,3 L 5,6 L 7,1 L 3,-2 L 8,-3 Z" fill="#3D2B4F"/>
    <!-- Open mouth -->
    <ellipse cx="0" cy="12" rx="7" ry="5" fill="#FF4D6D"/>

    <!-- Both arms up in celebration -->
    <g transform="translate(-50, -15) rotate(-40)">
      <rect x="-3" y="-35" width="7" height="40" rx="3" fill="#3D2B4F"/>
      <circle cx="0" cy="-40" r="9" fill="#FFF2C4"/>
    </g>
    <g transform="translate(50, -15) rotate(40)">
      <rect x="-3" y="-35" width="7" height="40" rx="3" fill="#3D2B4F"/>
      <circle cx="0" cy="-40" r="9" fill="#FFF2C4"/>
    </g>
  </g>

  <text x="200" y="380" text-anchor="middle" font-size="11" fill="#8B8094" font-family="'Poppins', sans-serif">For checkout success, order confirmation, sale banners</text>
</svg>
