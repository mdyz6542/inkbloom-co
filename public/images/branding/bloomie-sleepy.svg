<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#FFFBF5"/>
  <text x="200" y="30" text-anchor="middle" font-size="12" font-weight="600" fill="#8B8094" font-family="'Poppins', sans-serif" letter-spacing="2">BLOOMIE — SLEEPY</text>

  <g transform="translate(200, 230)">
    <!-- Stem (slightly drooping) -->
    <path d="M 0,60 Q 8,85 5,110" stroke="#D4E9D0" stroke-width="10" stroke-linecap="round" fill="none"/>
    <ellipse cx="-15" cy="95" rx="13" ry="6" fill="#D4E9D0" transform="rotate(-20 -15 95)"/>

    <!-- Petals (slightly tilted) -->
    <g transform="rotate(-8)">
      <ellipse cx="0" cy="-48" rx="26" ry="36" fill="#E4D6FF"/>
      <ellipse cx="-46" cy="-18" rx="26" ry="36" fill="#E4D6FF" transform="rotate(-60 -46 -18)"/>
      <ellipse cx="46" cy="-18" rx="26" ry="36" fill="#E4D6FF" transform="rotate(60 46 -18)"/>
      <ellipse cx="-34" cy="36" rx="26" ry="36" fill="#E4D6FF" transform="rotate(-130 -34 36)"/>
      <ellipse cx="34" cy="36" rx="26" ry="36" fill="#E4D6FF" transform="rotate(130 34 36)"/>

      <!-- Face -->
      <circle cx="0" cy="0" r="38" fill="#FFF2C4"/>
      <circle cx="-19" cy="7" r="6" fill="#FF4D6D" opacity="0.35"/>
      <circle cx="19" cy="7" r="6" fill="#FF4D6D" opacity="0.35"/>
      <!-- Closed sleeping eyes -->
      <path d="M -15,-5 Q -10,-10 -5,-5" stroke="#3D2B4F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M 5,-5 Q 10,-10 15,-5" stroke="#3D2B4F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Small sleeping mouth -->
      <ellipse cx="0" cy="9" rx="3" ry="2" fill="#3D2B4F"/>
    </g>

    <!-- Zzz letters -->
    <text x="60" y="-60" font-size="24" font-weight="700" fill="#8B8094" font-family="'Fredoka', sans-serif">z</text>
    <text x="75" y="-80" font-size="32" font-weight="700" fill="#8B8094" font-family="'Fredoka', sans-serif">z</text>
    <text x="95" y="-105" font-size="40" font-weight="700" fill="#8B8094" font-family="'Fredoka', sans-serif">z</text>
  </g>

  <text x="200" y="380" text-anchor="middle" font-size="11" fill="#8B8094" font-family="'Poppins', sans-serif">For empty cart, 404 pages, loading states</text>
</svg>
