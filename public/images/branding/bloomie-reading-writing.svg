<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#FFFBF5"/>
  <text x="200" y="30" text-anchor="middle" font-size="12" font-weight="600" fill="#8B8094" font-family="'Poppins', sans-serif" letter-spacing="2">BLOOMIE — READING/WRITING</text>

  <g transform="translate(200, 220)">
    <!-- Stem -->
    <rect x="-5" y="60" width="10" height="40" rx="5" fill="#D4E9D0"/>
    <ellipse cx="-18" cy="85" rx="13" ry="6" fill="#D4E9D0" transform="rotate(-30 -18 85)"/>

    <!-- Petals -->
    <ellipse cx="0" cy="-48" rx="26" ry="36" fill="#E4D6FF"/>
    <ellipse cx="-46" cy="-18" rx="26" ry="36" fill="#E4D6FF" transform="rotate(-60 -46 -18)"/>
    <ellipse cx="46" cy="-18" rx="26" ry="36" fill="#E4D6FF" transform="rotate(60 46 -18)"/>
    <ellipse cx="-34" cy="36" rx="26" ry="36" fill="#E4D6FF" transform="rotate(-130 -34 36)"/>
    <ellipse cx="34" cy="36" rx="26" ry="36" fill="#E4D6FF" transform="rotate(130 34 36)"/>

    <!-- Face -->
    <circle cx="0" cy="0" r="38" fill="#FFF2C4"/>
    <circle cx="-19" cy="9" r="6" fill="#FF4D6D" opacity="0.45"/>
    <circle cx="19" cy="9" r="6" fill="#FF4D6D" opacity="0.45"/>
    <!-- Eyes looking down at notebook, focused -->
    <path d="M -13,-3 Q -9,2 -5,-3" stroke="#3D2B4F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 5,-3 Q 9,2 13,-3" stroke="#3D2B4F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Small focused mouth -->
    <path d="M -3,10 Q 0,12 3,10" stroke="#3D2B4F" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Open notebook in front -->
    <g transform="translate(0, 75)">
      <!-- Notebook shadow -->
      <ellipse cx="0" cy="28" rx="75" ry="5" fill="#3D2B4F" opacity="0.1"/>
      <!-- Left page -->
      <path d="M -70,15 L -5,10 L -5,-10 L -70,-5 Z" fill="#FFFBF5" stroke="#3D2B4F" stroke-width="1.5"/>
      <!-- Right page -->
      <path d="M 5,10 L 70,15 L 70,-5 L 5,-10 Z" fill="#FFFBF5" stroke="#3D2B4F" stroke-width="1.5"/>
      <!-- Page lines -->
      <line x1="-60" y1="0" x2="-15" y2="-4" stroke="#8B8094" stroke-width="0.8" opacity="0.5"/>
      <line x1="-60" y1="6" x2="-15" y2="2" stroke="#8B8094" stroke-width="0.8" opacity="0.5"/>
      <line x1="15" y1="-4" x2="60" y2="0" stroke="#8B8094" stroke-width="0.8" opacity="0.5"/>
      <line x1="15" y1="2" x2="60" y2="6" stroke="#8B8094" stroke-width="0.8" opacity="0.5"/>
      <!-- A tiny doodled heart on the right page -->
      <path d="M 30,-2 C 28,-5 24,-4 24,-1 C 24,2 30,5 30,5 C 30,5 36,2 36,-1 C 36,-4 32,-5 30,-2 Z" fill="#FF4D6D"/>
    </g>

    <!-- Pen in hand (right side, writing) -->
    <g transform="translate(38, 60) rotate(-30)">
      <rect x="-2" y="-30" width="5" height="35" rx="2" fill="#3D2B4F"/>
      <path d="M -3,5 L 4,5 L 1,13 L -1,13 Z" fill="#FF4D6D"/>
      <rect x="-2" y="-34" width="5" height="5" rx="1" fill="#E4D6FF"/>
    </g>
  </g>

  <text x="200" y="380" text-anchor="middle" font-size="11" fill="#8B8094" font-family="'Poppins', sans-serif">For blog pages, About page, journaling/study content</text>
</svg>
